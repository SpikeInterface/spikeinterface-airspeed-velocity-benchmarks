name: Run Benchmarks

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      smoke:
        description: "Smoke test (~20 min): 2 versions, 2 suites, publish dry-run (no site update, no results saved)"
        type: boolean
        default: false
  schedule:
    - cron: '0 0 1 * *'  # Runs at midnight on the 1st of every month
  pull_request:  # Trigger on pull requests as well

permissions:
  contents: write  # asv gh-pages pushes

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SI_BENCH_DATA: ${{ github.workspace }}/data/np_snippet
      SMOKE: ${{ inputs.smoke }}  # empty (false) for schedule / pull_request

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # asv gh-pages needs the gh-pages branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # must match "pythons" in asv.conf.json

      - name: Install ASV and SpikeInterface (for fetching data only)
        # spikeinterface pinned: the version fetch_data.py was tested with against the AIND zarr (v2 + WavPack)
        run: pip install asv virtualenv "spikeinterface==0.105.4" s3fs wavpack-numcodecs

      # The snippet is fetched once and then cached; the key changes only when fetch_data.py does.
      - name: Cache benchmark data
        id: data-cache
        uses: actions/cache@v4
        with:
          path: data/np_snippet
          key: bench-data-${{ hashFiles('scripts/fetch_data.py') }}

      - name: Fetch benchmark data
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_data.py --out data/np_snippet

      # Reuse built environments for the tagged versions across runs.
      - name: Cache ASV environments
        uses: actions/cache@v4
        with:
          path: env
          key: asv-env-${{ hashFiles('asv.conf.json', 'hashestobenchmark.txt') }}

      # results/ is not stored anywhere else: cache it so tags are not rerun and history accumulates.
      # Caches are immutable, so save under a new key each run and restore the latest one.
      - name: Cache ASV results
        if: ${{ !inputs.smoke }}  # smoke results must not be reused by --skip-existing-successful
        uses: actions/cache@v4
        with:
          path: results
          key: asv-results-${{ github.run_id }}
          restore-keys: asv-results-

      - name: Run ASV benchmarks
        run: |
          # fixed machine name: runner hostnames are random and would split the graphs
          asv machine --yes --machine gh-ubuntu-latest
          if [ "$SMOKE" = "true" ]; then
            # zarr 2 release + zarr 3 main (fix_numcodecs.py), imports + real-data zarr suite
            for commit in 0.105.4 main; do
              asv run -a rounds=1 --machine gh-ubuntu-latest --bench ImportSuite --bench ZarrCompressionReadSuite "$commit^!"
            done
            exit 0
          fi
          asv run -a rounds=1 --machine gh-ubuntu-latest --skip-existing-successful HASHFILE:hashestobenchmark.txt
          asv run -a rounds=1 --machine gh-ubuntu-latest --skip-existing-successful main^!

      - name: Push ASV results to gh-pages
        if: github.event_name != 'pull_request'  # PRs only test; don't publish unmerged results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # asv builds on a *local* gh-pages branch; checkout only creates origin/gh-pages, and without it
          # asv makes an unrelated commit and the push is rejected as non-fast-forward
          git fetch origin gh-pages:gh-pages
          python scripts/patch_asv_html.py  # version labels on x ticks / tooltips, grid group order
          asv publish
          if [ "$SMOKE" = "true" ]; then
            asv gh-pages --no-push
            git push --dry-run origin gh-pages  # checks token + fast-forward without changing the site
          else
            asv gh-pages
          fi

      # smoke only: the built site, to preview locally (gh run download <id> -n asv-html; python -m http.server -d asv-html)
      - name: Upload site for preview
        if: ${{ inputs.smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: asv-html
          path: html
          retention-days: 7
